[package]
name = "floating-lyrics"
version = "0.1.0-alpha.2"
description = "A small companion for the songs you love"
authors = ["Mahrus Rohisyam"]
license = "MIT"
repository = "https://github.com/mahrus-rohisyam/floating-lyrics-desktop"
edition = "2021"

[lib]
name = "floating_lyrics_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["tray-icon", "macos-private-api"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls"] }
tiny_http = "0.12"
uuid = { version = "1", features = ["v4"] }
base64 = "0.22"
rustfft = "6"

[target.'cfg(windows)'.dependencies]
windows = { version = "0.62", features = ["Foundation", "Foundation_Collections", "Media_Control", "Storage_Streams"] }
wasapi = "0.25"

[target.'cfg(not(any(target_os = "android", target_os = "ios")))'.dependencies]
tauri-plugin-global-shortcut = "2"

[profile.release]
lto = true
codegen-units = 1
strip = true
